# Home Assistant: home automation. LAN only: https://home.lab.internal (helm/charts/lan-gateway).
# hostNetwork: mDNS/SSDP discovery runs from the node's VLAN 3 interface and reaches the main LAN by routing
# (not isolated from VLAN 3). Port 8123 is open on whichever node runs the pod.
# configuration.yaml is below and the automation packages are in helm/charts/home-assistant-packages (git);
# everything made in the UI (integrations, devices, dashboards, automations) lives in /config on Longhorn. First-run setup and lab integrations: scripts/home-assistant-setup.sh.
controllers:
  home-assistant:
    strategy: Recreate   # never two HA instances on one config
    pod:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet   # still resolve *.svc.cluster.local (Jellyfin, Sonarr, Radarr)
    initContainers:
      # the UI editors write these; configuration.yaml includes them. Create only when missing, never truncate.
      # Also (re)generates the doorbell chime in /config/www (served at /local/, fetched by the Sonos speakers).
      seed:
        image:
          repository: ghcr.io/home-assistant/home-assistant
          tag: 2026.10.1
        command:
          - sh
          - -c
          - |
            for f in automations:[] scripts:{} scenes:[]; do
              p=/config/${f%%:*}.yaml
              [ -e "$p" ] || echo "${f#*:}" > "$p"
            done
            python3 /seed/make-chime.py /config/www/doorbell.wav
    containers:
      app:
        image:
          repository: ghcr.io/home-assistant/home-assistant
          tag: 2026.10.1
        env:
          TZ: America/New_York
        probes:
          liveness: &probe
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 8123
              periodSeconds: 30
              failureThreshold: 5
          readiness: *probe
          startup:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 8123
              periodSeconds: 10
              failureThreshold: 30   # first start installs integration requirements
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi

service:
  app:
    controller: home-assistant
    ports:
      http:
        port: 8123

configMaps:
  config:
    data:
      configuration.yaml: |
        default_config:

        # core config lives here, not in the UI (the UI shows it read-only)
        homeassistant:
          name: Home
          latitude: 42.5274
          longitude: -71.7563
          unit_system: us_customary
          time_zone: America/New_York
          currency: USD
          country: US
          internal_url: https://home.lab.internal
          packages: !include_dir_named packages   # helm/charts/home-assistant-packages, mounted at /config/packages

        # No `http:` here: since 2026.10 HA keeps it in .storage (YAML is imported once, then ignored) and new config
        # must be confirmed. Proxy trust for the LAN gateway is applied + confirmed by scripts/home-assistant-setup.sh.

        # /api/prometheus, scraped with the long-lived token (ServiceMonitor below, token via ExternalSecret)
        prometheus:

        automation: !include automations.yaml
        script: !include scripts.yaml
        scene: !include scenes.yaml

      # two-bar "ding-dong" door chime (E5, C5), stdlib only (no audio file in git); run by the seed init container.
      # Modelled as struck metal bars (inharmonic partials, higher ones decay faster) plus a small room reverb.
      make-chime.py: |
        import math, os, struct, sys, wave
        out, RATE = sys.argv[1], 44100
        BAR = [(1.0, 1.0, 1.0), (2.756, 0.32, 0.35), (5.404, 0.10, 0.15), (8.933, 0.03, 0.08)]   # (ratio, amp, decay)
        def strike(buf, freq, at, decay):
            start = int(at * RATE)
            for ratio, amp, dk in BAR:
                w, d = 2 * math.pi * freq * ratio / RATE, decay * dk
                for i in range(min(len(buf) - start, int(d * 6 * RATE))):
                    t = i / RATE
                    buf[start + i] += amp * min(1.0, t / 0.003) * math.exp(-t / d) * math.sin(w * i)
        def reverb(buf, wet=0.18):   # Schroeder: 4 parallel combs + 2 allpasses
            rev = [0.0] * len(buf)
            for dl, fb in ((1557, .80), (1617, .79), (1491, .81), (1422, .78)):
                c = [0.0] * len(buf)
                for i, x in enumerate(buf):
                    c[i] = x + (fb * c[i - dl] if i >= dl else 0)
                    rev[i] += c[i] / 4
            for dl, g in ((225, .5), (556, .5)):
                a = [0.0] * len(rev)
                for i, x in enumerate(rev):
                    a[i] = -g * x + (rev[i - dl] if i >= dl else 0) + g * (a[i - dl] if i >= dl else 0)
                rev = a
            return [x + wet * y for x, y in zip(buf, rev)]
        buf = [0.0] * int(3.6 * RATE)
        strike(buf, 659.25, 0.0, 1.2)   # E5 "ding"
        strike(buf, 523.25, 0.5, 1.8)   # C5 "dong"
        buf = reverb(buf)
        fade = int(0.05 * RATE)
        for i in range(fade): buf[-1 - i] *= i / fade
        peak = max(abs(v) for v in buf)
        os.makedirs(os.path.dirname(out), exist_ok=True)
        with wave.open(out + '.tmp', 'wb') as w:
            w.setnchannels(1); w.setsampwidth(2); w.setframerate(RATE)
            w.writeframes(b''.join(struct.pack('<h', int(v / peak * 0.85 * 32767)) for v in buf))
        os.replace(out + '.tmp', out)

serviceMonitor:
  app:
    service:
      identifier: app
    endpoints:
      - port: http
        path: /api/prometheus
        interval: 1m
        authorization:
          type: Bearer
          credentials:   # helm/charts/secret-stores, from Vault secret/home-assistant api-token
            name: home-assistant-prometheus
            key: token

persistence:
  # recorder SQLite DB, .storage, UI-made YAML: Longhorn, never NFS
  config:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 5Gi
    globalMounts:
      - path: /config
  configuration:
    type: configMap
    identifier: config
    advancedMounts:
      home-assistant:
        app:
          - { path: /config/configuration.yaml, subPath: configuration.yaml, readOnly: true }
        seed:
          - { path: /seed/make-chime.py, subPath: make-chime.py, readOnly: true }
  # helm/charts/home-assistant-packages: automation packages (doorbell, movie mode), raw files so HA's {{ }}
  # templates aren't rendered by Helm. After a change: Developer tools -> YAML -> reload Automations.
  packages:
    type: configMap
    name: home-assistant-packages
    advancedMounts:
      home-assistant:
        app:
          - { path: /config/packages, readOnly: true }
