# Jellyfin: media server under BaseUrl /4orr (set by scripts/jellyfin-setup.py). LAN: https://jellyfin.lab.internal/4orr
# (and plain http:// for TV apps that can't trust the homelab CA); public: https://dagaflix.com/4orr.
# Library is the shared NFS claim, mounted READ-ONLY (Jellyfin keeps metadata/artwork in /config, on Longhorn;
# trickplay tiles on their own NFS share, mounted at /config/data/trickplay).
# Quick Sync: requests one share of the node's Intel UHD 630 via the Intel GPU device plugin.
controllers:
  jellyfin:
    strategy: Recreate
    pod:
      securityContext:
        # DSM user `media`: the NAS squashes root to guest, so root couldn't read the library
        runAsUser: 1029
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
        # host `render` (991) and `video` (44) groups own /dev/dri/*
        supplementalGroups: [44, 991]
    containers:
      app:
        image:
          repository: jellyfin/jellyfin
          tag: 12.2.20261005-225228
        env:
          TZ: America/New_York
          JELLYFIN_PublishedServerUrl: https://jellyfin.lab.internal/4orr
        probes:
          liveness: &probe
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /4orr/health   # BaseUrl; /health only redirects here
                port: 8096
              periodSeconds: 30
              failureThreshold: 5
          readiness: *probe
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /4orr/health   # BaseUrl; /health only redirects here
                port: 8096
              periodSeconds: 10
              failureThreshold: 30   # first start migrates/initialises the DB
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
            gpu.intel.com/i915: 1
          limits:
            memory: 6Gi
            gpu.intel.com/i915: 1

service:
  app:
    controller: jellyfin
    ports:
      http:
        port: 8096

persistence:
  # SQLite DB, metadata, artwork: Longhorn, never NFS
  config:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 20Gi
    globalMounts:
      - path: /config
  # transcodes + image cache: node-local scratch
  cache:
    type: emptyDir
    sizeLimit: 50Gi
    globalMounts:
      - path: /cache
  # trickplay (scrub preview) tiles on the NAS share /volume2/trickplay (helm/charts/media-storage), over the path
  # Jellyfin uses when "save trickplay with media" is off; keeps them off Longhorn and out of the media folders
  trickplay:
    type: persistentVolumeClaim
    existingClaim: jellyfin-trickplay
    globalMounts:
      - path: /config/data/trickplay
  # shared media share (helm/charts/media-storage), read-only
  data:
    type: persistentVolumeClaim
    existingClaim: media-data
    globalMounts:
      - path: /data
        readOnly: true
