# Prowlarr: indexer manager; pushes indexers to Radarr/Sonarr. No NAS access needed.
# UI: kubectl -n media port-forward svc/prowlarr 9696
# API key comes from Vault (secret/prowlarr) so the *arr apps can be wired together over their APIs.
controllers:
  prowlarr:
    strategy: Recreate
    containers:
      app:
        image:
          repository: lscr.io/linuxserver/prowlarr
          tag: 2.6.5.5623-ls163
        env:
          TZ: America/New_York
          PUID: "1029"
          PGID: "100"
          PROWLARR__AUTH__METHOD: Forms
          # LAN/cluster/port-forward clients skip login; anything routed in later must log in
          PROWLARR__AUTH__REQUIRED: DisabledForLocalAddresses
        envFrom:
          - secretRef:
              name: prowlarr   # PROWLARR__AUTH__APIKEY
        probes:
          liveness: &probe
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /ping
                port: 9696
              periodSeconds: 30
              failureThreshold: 5
          readiness: *probe
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 1Gi

service:
  app:
    controller: prowlarr
    ports:
      http:
        port: 9696

persistence:
  config:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 1Gi
    globalMounts:
      - path: /config
