# Prowlarr: indexer manager; pushes indexers to Radarr/Sonarr. No NAS access needed.
# UI: kubectl -n media port-forward svc/prowlarr 9696
# API key comes from Vault (secret/prowlarr) so the *arr apps can be wired together over their APIs.
controllers:
  prowlarr:
    strategy: Recreate
    containers:
      app:
        image:
          repository: lscr.io/linuxserver/prowlarr
          tag: 2.6.5.5623-ls163
        env:
          TZ: America/New_York
          PUID: "1029"
          PGID: "100"
          # LAN is trusted (README "LAN access"): no built-in login. Reachable only in-cluster and via the
          # LAN gateway (https://prowlarr.lab.internal). Servarr treats every proxied request as non-local, so
          # "DisabledForLocalAddresses" can't work behind the gateway; External = auth handled outside the app.
          # MUST switch to Forms (or put real auth in front) before exposing this via the public shared-gateway.
          PROWLARR__AUTH__METHOD: External
          # Override config.xml: info-level logs (debug was the default here) and no usage analytics
          PROWLARR__LOG__LEVEL: info
          PROWLARR__LOG__ANALYTICSENABLED: "False"
        envFrom:
          - secretRef:
              name: prowlarr   # PROWLARR__AUTH__APIKEY
        probes:
          liveness: &probe
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /ping
                port: 9696
              periodSeconds: 30
              failureThreshold: 5
          readiness: *probe
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 1Gi

      # Exportarr: Prometheus metrics for Prowlarr (queue, health, library), scraped via the ServiceMonitor below
      exportarr:
        image:
          repository: ghcr.io/onedr0p/exportarr
          tag: v2.3.0
        args: ["prowlarr"]
        env:
          PORT: "9707"
          URL: http://localhost:9696
          APIKEY:
            valueFrom:
              secretKeyRef: {name: prowlarr, key: PROWLARR__AUTH__APIKEY}
          ENABLE_ADDITIONAL_METRICS: "true"
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi

service:
  app:
    controller: prowlarr
    ports:
      http:
        port: 9696
      metrics:
        port: 9707

serviceMonitor:
  app:
    service:
      identifier: app
    endpoints:
      - port: metrics
        path: /metrics
        interval: 1m
        scrapeTimeout: 50s   # additional metrics walk the whole library

persistence:
  config:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 1Gi
    globalMounts:
      - path: /config
  # helm/charts/prowlarr-definitions: custom Cardigann definitions (e.g. wigornot). Read at startup only.
  definitions:
    type: configMap
    name: prowlarr-definitions
    globalMounts:
      - path: /config/Definitions/Custom
        readOnly: true
