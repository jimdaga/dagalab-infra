grafana:
  admin:
    # Synced from Vault (secret/grafana) by helm/charts/secret-stores
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  defaultDashboardsTimezone: browser

prometheus:
  prometheusSpec:
    retention: 15d
    # Pick up ServiceMonitors/PodMonitors from every app, not just this release
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi

alertmanager:
  # Alerts -> Discord #alerts. Webhook URL from Vault secret/discord (ExternalSecret `discord`, mounted below), never in git.
  config:
    route:
      receiver: discord-alerts
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        # always-firing heartbeat / meta alerts: not for humans
        - receiver: "null"
          matchers: ['alertname =~ "Watchdog|InfoInhibitor"']
    receivers:
      - name: "null"
      - name: discord-alerts
        discord_configs:
          - webhook_url_file: /etc/alertmanager/secrets/discord/webhook-alerts
            send_resolved: true
    inhibit_rules:
      - source_matchers: ['severity = "critical"']
        target_matchers: ['severity =~ "warning|info"']
        equal: [namespace, alertname]
      - source_matchers: ['severity = "warning"']
        target_matchers: ['severity = "info"']
        equal: [namespace, alertname]
      - source_matchers: ['alertname = "InfoInhibitor"']
        target_matchers: ['severity = "info"']
        equal: [namespace]
  alertmanagerSpec:
    secrets: [discord]   # -> /etc/alertmanager/secrets/discord/<key>
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

# RKE2's kube-proxy serves metrics on 127.0.0.1:10249 only, so the scrape always fails and KubeProxyDown fires forever.
# Don't scrape it (and don't alert on it) rather than reconfigure every node.
kubeProxy:
  enabled: false
