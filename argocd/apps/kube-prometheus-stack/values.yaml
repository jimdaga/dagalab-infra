grafana:
  admin:
    # Synced from Vault (secret/grafana) by helm/charts/secret-stores
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  defaultDashboardsTimezone: browser

prometheus:
  prometheusSpec:
    retention: 15d
    # Pick up ServiceMonitors/PodMonitors from every app, not just this release
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

# RKE2's kube-proxy serves metrics on 127.0.0.1:10249 only, so the scrape always fails and KubeProxyDown fires forever.
# Don't scrape it (and don't alert on it) rather than reconfigure every node.
kubeProxy:
  enabled: false
