# Sonarr: TV manager. Root folder /data/tv; downloads land in /data/downloads (same NFS share, so imports hardlink).
# UI: kubectl -n media port-forward svc/sonarr 8989
# API key comes from Vault (secret/sonarr). Runs as DSM user media (1029:100) to match the NAS share.
controllers:
  sonarr:
    strategy: Recreate
    containers:
      app:
        image:
          repository: lscr.io/linuxserver/sonarr
          tag: 4.0.20.3014-ls327
        env:
          TZ: America/New_York
          PUID: "1029"
          PGID: "100"
          # LAN is trusted (README "LAN access"): no built-in login. Reachable only in-cluster and via the
          # LAN gateway (https://sonarr.lab.internal). Servarr treats every proxied request as non-local, so
          # "DisabledForLocalAddresses" can't work behind the gateway; External = auth handled outside the app.
          # MUST switch to Forms (or put real auth in front) before exposing this via the public shared-gateway.
          SONARR__AUTH__METHOD: External
          # Override config.xml: info-level logs (debug was the default here) and no usage analytics
          SONARR__LOG__LEVEL: info
          SONARR__LOG__ANALYTICSENABLED: "False"
        envFrom:
          - secretRef:
              name: sonarr   # SONARR__AUTH__APIKEY
        probes:
          liveness: &probe
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /ping
                port: 8989
              periodSeconds: 30
              failureThreshold: 5
          readiness: *probe
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi

      # Exportarr: Prometheus metrics for Sonarr (queue, health, library), scraped via the ServiceMonitor below
      exportarr:
        image:
          repository: ghcr.io/onedr0p/exportarr
          tag: v2.3.0
        args: ["sonarr"]
        env:
          PORT: "9707"
          URL: http://localhost:8989
          APIKEY:
            valueFrom:
              secretKeyRef: {name: sonarr, key: SONARR__AUTH__APIKEY}
          ENABLE_ADDITIONAL_METRICS: "true"
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi

service:
  app:
    controller: sonarr
    ports:
      http:
        port: 8989
      metrics:
        port: 9707

serviceMonitor:
  app:
    service:
      identifier: app
    endpoints:
      - port: metrics
        path: /metrics
        interval: 1m
        scrapeTimeout: 50s   # additional metrics walk the whole library

persistence:
  # SQLite config DB: Longhorn, never NFS
  config:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 5Gi
    globalMounts:
      - path: /config
  # Shared media share: library + downloads (helm/charts/media-storage)
  data:
    type: persistentVolumeClaim
    existingClaim: media-data
    globalMounts:
      - path: /data
