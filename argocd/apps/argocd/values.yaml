# Argo CD manages itself. The same file is used for the initial `helm install`
# during bootstrap (see `make bootstrap`), so keep the two in sync by only editing here.
global:
  domain: argocd.jimdaga.dev

configs:
  params:
    # TLS terminates at the shared Gateway
    server.insecure: true
  cm:
    # Restore Application health assessment so sync-waves between child apps
    # in the app-of-apps actually wait on each other.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs
  repositories:
    # Envoy Gateway's chart is only published to an OCI registry
    envoy-gateway:
      name: envoy-gateway
      type: helm
      url: docker.io/envoyproxy
      enableOCI: "true"

dex:
  enabled: false

redis-ha:
  enabled: false
