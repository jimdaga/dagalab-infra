# Homepage (gethomepage.dev): LAN dashboard at https://homepage.lab.internal (helm/charts/lan-gateway).
# All config lives below as files in a ConfigMap; edit here, Argo CD rolls the pod.
# Widget API keys come from Vault via the `homepage` ExternalSecret (HOMEPAGE_VAR_* env vars).
# app-template runs values through tpl, so Homepage's {{HOMEPAGE_VAR_X}} placeholders are written as {{ "{{HOMEPAGE_VAR_X}}" }}.
controllers:
  homepage:
    strategy: RollingUpdate
    serviceAccount:
      identifier: homepage
    pod:
      automountServiceAccountToken: true   # kubernetes integration: node/pod stats
    containers:
      app:
        image:
          repository: ghcr.io/gethomepage/homepage
          tag: v2.5.0
        env:
          TZ: America/New_York
          # Homepage refuses requests for hostnames not listed here
          HOMEPAGE_ALLOWED_HOSTS: homepage.lab.internal
        envFrom:
          - secretRef:
              name: homepage   # HOMEPAGE_VAR_{SONARR,RADARR,PROWLARR,JELLYFIN,SEERR,GLUETUN,BAZARR}_KEY, _UNIFI_PASSWORD
          - secretRef:
              name: homepage-synology   # HOMEPAGE_VAR_SYNOLOGY_PASSWORD (URL-encoded)
        # Since v2.2 the dashboard page is pre-rendered at image build and settings.yaml (title, background, layout) is
        # only applied after a revalidate (the refresh button, or POST /api/revalidate). Do it on every start; after a
        # settings.yaml-only change that doesn't roll the pod, press refresh (bottom right).
        lifecycle:
          postStart:
            exec:
              command: [sh, -c, 'for i in $(seq 1 60); do wget -q -O /dev/null --post-data="" http://127.0.0.1:3000/api/revalidate && exit 0; sleep 2; done; exit 0']
        probes:
          liveness: &probe
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/healthcheck
                port: 3000
                httpHeaders:
                  - name: Host
                    value: homepage.lab.internal
              periodSeconds: 30
          readiness: *probe
        resources:
          requests:
            cpu: 20m
            memory: 128Mi
          limits:
            memory: 512Mi

# Read-only cluster access for the kubernetes widget + per-tile pod status
serviceAccount:
  homepage: {}
rbac:
  roles:
    homepage:
      type: ClusterRole
      rules:
        - apiGroups: [""]
          resources: [namespaces, pods, nodes]
          verbs: [get, list]
        - apiGroups: [metrics.k8s.io]
          resources: [nodes, pods]
          verbs: [get, list]
        - apiGroups: [networking.k8s.io]   # cluster mode lists Ingresses for discovery (none here; avoids an error per refresh)
          resources: [ingresses]
          verbs: [get, list]
  bindings:
    homepage:
      type: ClusterRoleBinding
      roleRef:
        identifier: homepage
      subjects:
        - identifier: homepage

service:
  app:
    controller: homepage
    ports:
      http:
        port: 3000

configMaps:
  config:
    data:
      settings.yaml: |
        title: dagalab
        favicon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/homepage.png
        theme: dark
        color: slate
        background:
          image: https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=2560&q=80
          blur: sm
          saturate: 60
          brightness: 50
          opacity: 60
        cardBlur: md
        headerStyle: boxed
        statusStyle: dot
        hideVersion: true
        useEqualHeights: true
        showStats: false        # per-tile CPU/memory appears on hover-expand ("expand" below)
        providers:
          longhorn:
            url: http://longhorn-frontend.longhorn-system.svc.cluster.local   # used by the longhorn info widget
        quicklaunch:
          searchDescriptions: true
          hideInternetSearch: false
        layout:
          Watch:
            style: row
            columns: 2
            icon: mdi-play-box-multiple
          Library:
            style: row
            columns: 3
            icon: mdi-bookshelf
          Downloads:
            style: row
            columns: 3
            icon: mdi-download-network
          Upcoming:
            style: row
            columns: 1
            icon: mdi-calendar-star
          Platform:
            style: row
            columns: 5
            icon: mdi-kubernetes
          Network:
            style: row
            columns: 2
            icon: mdi-lan

      kubernetes.yaml: |
        mode: cluster

      services.yaml: |
        - Watch:
            - Jellyfin:
                href: https://jellyfin.lab.internal
                icon: jellyfin.png
                description: Watch
                namespace: media
                app: jellyfin
                siteMonitor: http://jellyfin.media.svc.cluster.local:8096/health
                # version 2 = Jellyfin 10.11+/12 API (Authorization: MediaBrowser Token header, no /emby or api_key)
                widget:
                  type: jellyfin
                  version: 2
                  url: http://jellyfin.media.svc.cluster.local:8096
                  key: "{{ "{{HOMEPAGE_VAR_JELLYFIN_KEY}}" }}"
                  enableBlocks: true        # library counts (movies / series / episodes)
                  enableNowPlaying: true    # active streams, with pause/resume
                  enableUser: true
                  showEpisodeNumber: true
            - Seerr:
                href: https://seerr.lab.internal
                icon: jellyseerr.png
                description: Requests
                namespace: media
                app: seerr
                siteMonitor: http://seerr.media.svc.cluster.local:5055/api/v1/status
                widget:
                  type: jellyseerr   # Seerr keeps the Jellyseerr/Overseerr API
                  url: http://seerr.media.svc.cluster.local:5055
                  key: "{{ "{{HOMEPAGE_VAR_SEERR_KEY}}" }}"
        - Library:
            - Sonarr:
                href: https://sonarr.lab.internal
                icon: sonarr.png
                description: TV
                namespace: media
                app: sonarr
                siteMonitor: http://sonarr.media.svc.cluster.local:8989/ping
                widget:
                  type: sonarr
                  url: http://sonarr.media.svc.cluster.local:8989
                  key: "{{ "{{HOMEPAGE_VAR_SONARR_KEY}}" }}"
            - Radarr:
                href: https://radarr.lab.internal
                icon: radarr.png
                description: Movies
                namespace: media
                app: radarr
                siteMonitor: http://radarr.media.svc.cluster.local:7878/ping
                widget:
                  type: radarr
                  url: http://radarr.media.svc.cluster.local:7878
                  key: "{{ "{{HOMEPAGE_VAR_RADARR_KEY}}" }}"
            - Bazarr:
                href: https://bazarr.lab.internal
                icon: bazarr.png
                description: Subtitles
                namespace: media
                app: bazarr
                siteMonitor: http://bazarr.media.svc.cluster.local:6767
                widget:
                  type: bazarr   # missing episode / movie subtitles
                  url: http://bazarr.media.svc.cluster.local:6767
                  key: "{{ "{{HOMEPAGE_VAR_BAZARR_KEY}}" }}"
        - Downloads:
            - qBittorrent:
                href: https://torrent.lab.internal
                icon: qbittorrent.png
                description: Torrents
                namespace: media
                app: qbittorrent
                siteMonitor: http://qbittorrent.media.svc.cluster.local:8080
                widget:
                  type: qbittorrent
                  url: http://qbittorrent.media.svc.cluster.local:8080
                  username: admin   # unused: qBittorrent trusts the pod network
                  password: unused
                  enableLeechProgress: true
            - VPN:
                href: https://torrent.lab.internal
                icon: gluetun.png
                description: PIA via Gluetun (qBittorrent's kill switch)
                widget:
                  type: gluetun
                  url: http://qbittorrent.media.svc.cluster.local:8000
                  key: "{{ "{{HOMEPAGE_VAR_GLUETUN_KEY}}" }}"
                  version: 2
                  fields: [public_ip, country, port_forwarded]
            - Prowlarr:
                href: https://prowlarr.lab.internal
                icon: prowlarr.png
                description: Indexers
                namespace: media
                app: prowlarr
                siteMonitor: http://prowlarr.media.svc.cluster.local:9696/ping
                widget:
                  type: prowlarr
                  url: http://prowlarr.media.svc.cluster.local:9696
                  key: "{{ "{{HOMEPAGE_VAR_PROWLARR_KEY}}" }}"
        - Upcoming:
            - Releases:
                icon: mdi-calendar-month
                widget:
                  type: calendar
                  view: agenda
                  maxEvents: 12
                  showTime: true
                  previousDays: 1
                  integrations:
                    - type: sonarr
                      service_group: Library
                      service_name: Sonarr
                      color: teal
                    - type: radarr
                      service_group: Library
                      service_name: Radarr
                      color: amber
        - Platform:
            - Argo CD:
                href: https://argocd.lab.internal
                icon: argo-cd.png
                description: GitOps
                namespace: argocd
                app: argocd-server
                siteMonitor: http://argocd-server.argocd.svc.cluster.local/healthz
            - Grafana:
                href: https://grafana.lab.internal
                icon: grafana.png
                description: Dashboards
                namespace: monitoring
                app: grafana
                siteMonitor: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local/api/health
            - Media pipeline:
                href: https://grafana.lab.internal/d/dagalab-media-pipeline
                icon: mdi-pipe
                description: Alerts, subtitles, extraction, free space
                widget:
                  type: prometheusmetric
                  url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
                  refreshInterval: 60000
                  metrics:
                    - label: Alerts firing
                      query: count(ALERTS{alertstate="firing", alertname!="Watchdog"}) or vector(0)
                    - label: Missing subs
                      query: sum(bazarr_subtitles_missing_total{namespace="media"})
                    - label: Extracting
                      query: sum(unpackerr_gauges{namespace="media", name=~"queued|extracting"}) or vector(0)
                    - label: Media free
                      query: min(sonarr_rootfolder_freespace_bytes{namespace="media"})
                      format:
                        type: bytes
            - Longhorn:
                href: https://longhorn.lab.internal
                icon: longhorn.png
                description: Block storage
                namespace: longhorn-system
                podSelector: app=longhorn-ui
                siteMonitor: http://longhorn-frontend.longhorn-system.svc.cluster.local
            - Vault:
                href: https://vault.lab.internal
                icon: vault.png
                description: Secrets
                namespace: vault
                app: vault
                siteMonitor: http://vault-active.vault.svc.cluster.local:8200/v1/sys/health
        # `homepage` accounts on the devices (UniFi: Network View Only; DSM: administrators, required for the stats API);
        # passwords from Vault secret/homepage-devices
        - Network:
            - UniFi:
                href: https://192.168.3.1
                icon: ubiquiti-unifi.png
                description: Cloud Gateway Ultra
                widget:
                  type: unifi
                  url: https://192.168.3.1
                  username: homepage
                  password: "{{ "{{HOMEPAGE_VAR_UNIFI_PASSWORD}}" }}"
            - daga-nas:
                href: https://192.168.3.20:5001
                icon: synology-dsm.png
                description: Synology DS420+ (DSM)
                widget:
                  type: diskstation
                  url: https://192.168.3.20:5001
                  username: homepage   # DSM only serves these stats to administrators
                  password: "{{ "{{HOMEPAGE_VAR_SYNOLOGY_PASSWORD}}" }}"
                  volume: volume_2     # the media share

      bookmarks.yaml: |
        - Infrastructure:
            - dagalab-infra:
                - icon: github.png
                  href: https://github.com/jimdaga/dagalab-infra
            - Homarr (trial):
                - icon: homarr.png
                  href: https://homarr.lab.internal
        - Personal:
            - Proton Mail:
                - icon: proton-mail.png
                  href: https://mail.proton.me/

      widgets.yaml: |
        - kubernetes:
            cluster:
              show: true
              cpu: true
              memory: true
              showLabel: true
              label: dagalab
            nodes:
              show: true
              cpu: true
              memory: true
              showLabel: true
        - longhorn:
            expanded: true
            total: true
            labels: true
            nodes: true
        - openmeteo:   # no API key needed
            label: Leominster
            latitude: 42.5274
            longitude: -71.7563
            timezone: America/New_York
            units: imperial
            cache: 15   # minutes
        - search:
            provider: duckduckgo
            target: _blank
        - datetime:
            text_size: md
            format:
              dateStyle: medium
              timeStyle: short

      # unused integrations; present so Homepage doesn't log about missing files
      docker.yaml: ""
      custom.css: ""
      custom.js: ""

persistence:
  # Homepage writes logs/cache under /app/config, so it's a writable emptyDir with the config files layered on top
  config-dir:
    type: emptyDir
    globalMounts:
      - path: /app/config
  config:
    type: configMap
    identifier: config
    globalMounts:
      - { path: /app/config/settings.yaml,  subPath: settings.yaml,  readOnly: true }
      - { path: /app/config/services.yaml,  subPath: services.yaml,  readOnly: true }
      - { path: /app/config/bookmarks.yaml, subPath: bookmarks.yaml, readOnly: true }
      - { path: /app/config/widgets.yaml,   subPath: widgets.yaml,   readOnly: true }
      - { path: /app/config/docker.yaml,    subPath: docker.yaml,    readOnly: true }
      - { path: /app/config/kubernetes.yaml, subPath: kubernetes.yaml, readOnly: true }
      - { path: /app/config/custom.css,     subPath: custom.css,     readOnly: true }
      - { path: /app/config/custom.js,      subPath: custom.js,      readOnly: true }
