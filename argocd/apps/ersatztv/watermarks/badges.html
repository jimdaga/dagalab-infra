<!doctype html>
<!-- ErsatzTV channel watermarks ("retro badge" style). Each .badge is screenshotted with a transparent background into
     <channel>.png next to this file (Playwright: element.screenshot({omitBackground: true})), then uploaded in the
     ErsatzTV UI (Watermarks). Edit here and re-render; README "Media stack plan" item 10. -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Barlow Condensed'; font-weight: 700;
               src: url('../../../../helm/charts/tv-guide/fonts/BarlowCondensed-Bold.ttf'); }
  body { margin: 0; padding: 24px; background: transparent; display: flex; flex-direction: column; gap: 24px;
         align-items: flex-start; }
  .badge { display: inline-flex; align-items: center; gap: 14px; height: 76px; padding: 0 30px 0 12px;
           border-radius: 38px; font: 700 46px/1 'Barlow Condensed', 'Arial Narrow', sans-serif; letter-spacing: .04em;
           color: #fff; text-shadow: 2px 2px 0 rgba(0, 0, 0, .45); white-space: nowrap;
           box-shadow: inset 0 2px 0 rgba(255, 255, 255, .35), inset 0 -3px 0 rgba(0, 0, 0, .25);
           border: 3px solid rgba(255, 255, 255, .55); }
  .icon { width: 58px; height: 58px; border-radius: 50%; background: rgba(0, 0, 0, .25); display: flex;
          align-items: center; justify-content: center; font-size: 38px; text-shadow: none; }
  .num { font-size: 30px; opacity: .85; margin-left: -4px; }
</style>
</head>
<body>
  <div class="badge" id="1"  style="background: linear-gradient(90deg, #c9b200, #06106b)"><span class="icon">📺</span>TV GUIDE</div>
  <div class="badge" id="7"  style="background: linear-gradient(90deg, #00b4db, #f7b733)"><span class="icon">🎈</span>KIDS CLUB</div>
  <div class="badge" id="10" style="background: linear-gradient(90deg, #4b6c80, #16222a)"><span class="icon">📎</span>THE OFFICE</div>
  <div class="badge" id="13" style="background: linear-gradient(90deg, #f7971e, #6b1a1a)"><span class="icon">🎃</span>FRIGHT NIGHT</div>
  <div class="badge" id="25" style="background: linear-gradient(90deg, #c21b1b, #1f8a2b)"><span class="icon">❄️</span>CHRISTMAS</div>
  <div class="badge" id="30" style="background: linear-gradient(90deg, #8e0e00, #1f1c18)"><span class="icon">🎬</span>PREMIERE</div>
  <div class="badge" id="40" style="background: linear-gradient(90deg, #11998e, #2b5876)"><span class="icon">🚗</span>ROAD TRIP</div>
  <div class="badge" id="80" style="background: linear-gradient(90deg, #ff512f, #dd2476)"><span class="icon">🍿</span>THROWBACK THEATER</div>
  <div class="badge" id="90" style="background: linear-gradient(90deg, #ff3cac, #784ba0, #2b86c5)"><span class="icon">📼</span>90s REWIND</div>
</body>
</html>
