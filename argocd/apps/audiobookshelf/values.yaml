# Audiobookshelf: audiobook + podcast server with phone apps and per-user progress. Public https://books.dagaflix.com
# (shared-gateway), LAN https://books.lab.internal. Its own accounts (no Jellyfin sign-in): root `jim` + one per
# person, long random passwords. Libraries: Audiobooks = /data/audiobooks (Bookshelf) + /data/audible (Libation), the
# media share mounted READ-ONLY; Podcasts = /podcasts, the DSM share `podcasts` (the only place it writes). subPath
# would have limited it to the audio folders, but kubelet can't prepare subPaths on the root-squashed share.
# First run + libraries + Homepage key: scripts/audiobookshelf-setup.sh (must run before the public route exists).
controllers:
  audiobookshelf:
    strategy: Recreate   # never two instances on one SQLite DB
    pod:
      securityContext:   # DSM user media; non-root, hence PORT 13378 (can't bind 80)
        runAsUser: 1029
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
    containers:
      app:
        image:
          repository: ghcr.io/advplyr/audiobookshelf
          tag: 2.37.1
        env:
          TZ: America/New_York
          PORT: "13378"
        probes:
          liveness: &probe
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthcheck
                port: 13378
              periodSeconds: 30
              failureThreshold: 5
          readiness: *probe
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi

service:
  app:
    controller: audiobookshelf
    ports:
      http:
        port: 80
        targetPort: 13378

persistence:
  # SQLite DB: Longhorn, never NFS
  config:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 2Gi
    globalMounts:
      - path: /config
  # covers, cache, backups
  metadata:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 10Gi
    globalMounts:
      - path: /metadata
  # the media share, read-only: books arrive via Bookshelf (audiobooks/) and Libation (audible/)
  media:
    type: persistentVolumeClaim
    existingClaim: media-data
    globalMounts:
      - { path: /data, readOnly: true }
  # podcast episodes: DSM share `podcasts` (helm/charts/media-storage)
  podcasts:
    type: persistentVolumeClaim
    existingClaim: podcasts
    globalMounts:
      - path: /podcasts
