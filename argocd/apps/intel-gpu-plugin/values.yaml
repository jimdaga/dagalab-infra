# Advertises each node's Intel iGPU (UHD 630, /dev/dri/renderD128) as gpu.intel.com/i915 so pods
# (Jellyfin Quick Sync) can request it without running privileged.
name: intel-gpu
# up to 4 pods may share one node's GPU
sharedDevNum: 4
# Every node has the iGPU, and Node Feature Discovery isn't installed: select all amd64 nodes
# instead of NFD's intel.feature.node.kubernetes.io/gpu label, and skip the NodeFeatureRule.
nodeSelector:
  kubernetes.io/arch: amd64
  intel.feature.node.kubernetes.io/gpu: null   # remove the chart default (Helm merges maps)
nodeFeatureRule: false
# Don't mount /dev/dri/by-path symlinks into pods: on these nodes (kernel 7.0) the extra
# "...platform-simple-framebuffer.0-card" entry makes containerd fail ("mkdir ... file exists").
# Apps use /dev/dri/renderD128 directly. If a GPU pod fails with "failed to fulfil mount request: open
# /dev/dri/by-path/...simple-framebuffer.0-card", that node has a stale CDI spec from before this setting
# (/var/run/cdi/intel.cdi.k8s.io-gpu-card1.yaml listing by-path mounts): delete it and restart that node's plugin pod.
bypathMode: none
