# /etc/rancher/rke2/config.yaml on dagakube01 (192.168.3.11), the first server.
# All three nodes are servers (control-plane + etcd + workloads).
token: "<shared-cluster-token>" # generate once: openssl rand -hex 32; do NOT commit the real value
node-ip: 192.168.3.11
tls-san:
  - 192.168.3.10       # reserved for a future kube-vip API VIP
  - k8s.lab.internal
write-kubeconfig-mode: "0600"

# Bundled ingress controllers we replace with Argo CD-managed envoy-gateway.
# (RKE2 1.36+ defaults to Traefik.) rke2-metrics-server and rke2-snapshot-controller stay enabled.
disable:
  - rke2-ingress-nginx
  - rke2-traefik
  - rke2-traefik-crd     # also ships Gateway API CRDs; envoy-gateway owns those

cni: canal

# etcd snapshots (local); TODO: ship to S3/NAS
etcd-snapshot-schedule-cron: "0 */6 * * *"
etcd-snapshot-retention: 20

# Expose control-plane metrics for kube-prometheus-stack
etcd-expose-metrics: true
kube-controller-manager-arg:
  - bind-address=0.0.0.0
kube-scheduler-arg:
  - bind-address=0.0.0.0
kube-proxy-arg:
  - metrics-bind-address=0.0.0.0:10249
