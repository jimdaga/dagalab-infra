# dagalab node: 10 min on battery -> graceful cluster stop + power off (dagalab-upssched -> dagalab-ups-shutdown).
# Power back before then -> timer cancelled, nothing happens. Low battery / FSD -> upsmon SHUTDOWNCMD (backstop).
CMDSCRIPT /usr/local/sbin/dagalab-upssched
PIPEFN /run/nut/upssched.pipe
LOCKFN /run/nut/upssched.lock
AT ONBATT * START-TIMER cluster-shutdown 600
AT ONLINE * CANCEL-TIMER cluster-shutdown
AT ONBATT * EXECUTE onbatt
AT ONLINE * EXECUTE online
