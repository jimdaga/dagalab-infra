{{- range .Values.issuers }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .name }}
spec:
  acme:
    email: {{ $.Values.email }}
    server: {{ .server }}
    privateKeySecretRef:
      name: {{ .name }}-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: {{ $.Values.cloudflare.apiTokenSecret.name }}
              key: {{ $.Values.cloudflare.apiTokenSecret.key }}
{{- end }}
