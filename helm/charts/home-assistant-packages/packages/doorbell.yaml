# Front door ring: chime on the downstairs Sonos, flash the porch light, phone notification that opens the
# doorbell's live view when tapped (the app reaches home.lab.internal, so on the home network only).
automation:
  - id: dagalab_doorbell
    alias: Doorbell
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: event.front_door_front_door_chime
        not_from: unavailable
        not_to: [unavailable, unknown]
    conditions:
      - "{{ trigger.to_state.attributes.event_type == 'ring' }}"
    actions:
      - parallel:
          - action: media_player.play_media
            target:
              entity_id: [media_player.living_room_living_room, media_player.sunroom_sunroom]
            data:
              media_content_id: http://home.lab.internal/local/doorbell.wav   # plain http: Sonos can't trust the lab CA
              media_content_type: music
              announce: true
              extra:
                volume: 40
          - action: light.turn_on
            target:
              entity_id: light.front_door_front_door
            data:
              flash: long
          - action: notify.mobile_app_jim_d_agostinos_iphone
            data:
              title: Doorbell
              message: Someone's at the front door
              data:
                # tap opens the live view in the app. No picture in the notification: this doorbell is WebRTC-only,
                # Google won't generate stills for it ("camera not supporting RTSP") and HA serves a placeholder
                url: "entityId:camera.front_door_front_door"
                push:
                  interruption-level: time-sensitive
      - delay: 15   # one alert per visitor, not per press

  # Person at the door (no ring): phone notification only, no chime or light. Fires for anyone the doorbell
  # camera sees, family included; a 2-minute cooldown keeps one visit to one alert.
  - id: dagalab_front_door_person
    alias: Front door person
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: event.front_door_front_door_motion
        not_from: unavailable
        not_to: [unavailable, unknown]
    conditions:
      - "{{ trigger.to_state.attributes.event_type == 'camera_person' }}"
    actions:
      - action: notify.mobile_app_jim_d_agostinos_iphone
        data:
          title: Front door
          message: Someone's at the front door
          data:
            url: "entityId:camera.front_door_front_door"   # live view; no stills (see Doorbell above)
            push:
              interruption-level: time-sensitive
      - delay: 120
