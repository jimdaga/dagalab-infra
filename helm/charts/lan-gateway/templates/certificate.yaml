apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard
  namespace: {{ .Release.Namespace }}
spec:
  secretName: wildcard-tls
  issuerRef:
    kind: ClusterIssuer
    name: {{ .Values.certificate.issuer }}
  commonName: {{ printf "*.%s" .Values.domain | quote }}
  dnsNames:
    - {{ printf "*.%s" .Values.domain | quote }}
