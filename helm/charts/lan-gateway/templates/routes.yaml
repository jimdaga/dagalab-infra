{{- range .Values.routes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .host }}-lan   # -lan: shared-gateway uses the bare host name for its routes
  namespace: {{ .namespace }}
spec:
  parentRefs:
    - name: {{ $.Values.gateway.name }}
      namespace: {{ $.Release.Namespace }}
      sectionName: https
    {{- if .http }}
    # plain HTTP too; this hostname-specific route wins over the catch-all https-redirect
    - name: {{ $.Values.gateway.name }}
      namespace: {{ $.Release.Namespace }}
      sectionName: http
    {{- end }}
  hostnames:
    - {{ printf "%s.%s" .host $.Values.domain | quote }}
  rules:
    - {{- with .pathPrefix }}
      matches:
        - path:
            type: PathPrefix
            value: {{ . }}
      {{- end }}
      backendRefs:
        - name: {{ .service }}
          port: {{ .port }}
    {{- with .pathPrefix }}
    # anything outside the app's path (e.g. the bare host typed in a browser) -> its web UI
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: {{ printf "%s/web/" . }}
            statusCode: 302
    {{- end }}
{{- end }}
