{{- range .Values.routes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .host }}-lan   # -lan: shared-gateway uses the bare host name for its routes
  namespace: {{ .namespace }}
spec:
  parentRefs:
    - name: {{ $.Values.gateway.name }}
      namespace: {{ $.Release.Namespace }}
      sectionName: https
    {{- if .http }}
    # plain HTTP too; this hostname-specific route wins over the catch-all https-redirect
    - name: {{ $.Values.gateway.name }}
      namespace: {{ $.Release.Namespace }}
      sectionName: http
    {{- end }}
  hostnames:
    - {{ printf "%s.%s" .host $.Values.domain | quote }}
  rules:
    - backendRefs:
        - name: {{ .service }}
          port: {{ .port }}
{{- end }}
