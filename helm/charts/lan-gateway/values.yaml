# LAN-only gateway: https://<host>.lab.internal -> in-cluster services. Not reachable from the internet.
# DNS: one UniFi A record per host below -> gateway.loadBalancerIP.
domain: lab.internal

# The cluster's single GatewayClass lives here (shared-gateway reuses it when unparked).
gatewayClass:
  name: envoy

gateway:
  name: lan
  loadBalancerIP: 192.168.3.201   # MetalLB pool; .200 stays reserved for the public shared-gateway

certificate:
  issuer: lab-internal-ca         # helm/charts/lab-ca

# host.lab.internal -> service:port in namespace. LAN is trusted: apps that skip auth for
# local addresses (the *arr apps, qBittorrent's pod-network bypass) won't prompt via the gateway.
routes:
  - { host: homepage, namespace: homepage,        service: homepage,                      port: 3000 }
  - { host: homarr,   namespace: homarr,          service: homarr,                        port: 7575 }
  # httpPaths: plain http only for these prefixes. /local/ = HA's static files (doorbell chime fetched by Sonos).
  - { host: home,     namespace: home-assistant,  service: home-assistant,                port: 8123, httpPaths: [/local/] }
  # http: true also serves plain http://<host> (no redirect): TV apps can't install the homelab CA.
  - { host: jellyfin, namespace: media,           service: jellyfin,                      port: 8096, http: true }
  - { host: plex,     namespace: media,           service: plex,                          port: 32400 }
  - { host: seerr,    namespace: media,           service: seerr,                         port: 5055 }
  - { host: torrent,  namespace: media,           service: qbittorrent,                   port: 8080 }
  - { host: sonarr,   namespace: media,           service: sonarr,                        port: 8989 }
  - { host: radarr,   namespace: media,           service: radarr,                        port: 7878 }
  - { host: bookshelf, namespace: media,          service: bookshelf,                     port: 8787 }
  - { host: prowlarr, namespace: media,           service: prowlarr,                      port: 9696 }
  - { host: bazarr,   namespace: media,           service: bazarr,                        port: 6767 }
  - { host: argocd,   namespace: argocd,          service: argocd-server,                 port: 80 }
  - { host: grafana,  namespace: monitoring,      service: kube-prometheus-stack-grafana, port: 80 }
  - { host: longhorn, namespace: longhorn-system, service: longhorn-frontend,             port: 80 }
  - { host: vault,    namespace: vault,           service: vault-ui,                      port: 8200 }
