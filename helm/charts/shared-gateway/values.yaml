# PUBLIC gateway: the UCG forwards WAN 443 here. Only routes listed below are internet-facing;
# platform UIs stay on lan-gateway (*.lab.internal), never here.
domain: dagaflix.com

gatewayClass:
  name: envoy

gateway:
  name: shared
  # Fixed IP from the MetalLB pool (see README "Network")
  loadBalancerIP: 192.168.3.200

certificate:
  issuer: letsencrypt-prod

# HTTPRoutes: <host>.<domain> (or the bare domain when host is empty) -> service:port in namespace,
# optionally only under pathPrefix. `name` defaults to host; must not collide with lan-gateway's <host>-lan.
# Jellyfin lives under an unadvertised path (its BaseUrl); clients use https://dagaflix.com/4orr.
routes:
  - { name: jellyfin, host: "", pathPrefix: /4orr, namespace: media, service: jellyfin, port: 8096 }

# Every other path on the bare domain gets this page straight from Envoy, so scanners see nothing
# that identifies the server. The body is an Envoy format string: never use a percent sign in it.
placeholder:
  title: dagaflix.com
  text: dagaflix.com

# www.<domain> -> https://<domain>
redirectWww: true
