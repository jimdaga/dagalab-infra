# PUBLIC gateway: the UCG forwards WAN 443 here. Only routes listed below are internet-facing;
# platform UIs stay on lan-gateway (*.lab.internal), never here.
domain: dagaflix.com

gatewayClass:
  name: envoy

gateway:
  name: shared
  # Fixed IP from the MetalLB pool (see README "Network")
  loadBalancerIP: 192.168.3.200

certificate:
  issuer: letsencrypt-prod

# HTTPRoutes: <host>.<domain> (or the bare domain when host is empty) -> service:port in namespace.
# `name` defaults to host; route names must not collide with lan-gateway's <host>-lan.
routes:
  - { name: jellyfin, host: "", namespace: media, service: jellyfin, port: 8096 }
