{{- range .Values.routes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .name | default .host }}
  namespace: {{ .namespace }}
spec:
  parentRefs:
    - name: {{ $.Values.gateway.name }}
      namespace: {{ $.Release.Namespace }}
      sectionName: https
  hostnames:
    - {{ ternary (printf "%s.%s" .host $.Values.domain) $.Values.domain (ne .host "") | quote }}
  rules:
    - {{- with .pathPrefix }}
      matches:
        - path:
            type: PathPrefix
            value: {{ . }}
      {{- end }}
      backendRefs:
        - name: {{ .service }}
          port: {{ .port }}
{{- end }}
