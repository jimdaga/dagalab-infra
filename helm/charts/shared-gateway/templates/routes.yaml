{{- range .Values.routes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .host }}
  namespace: {{ .namespace }}
spec:
  parentRefs:
    - name: {{ $.Values.gateway.name }}
      namespace: {{ $.Release.Namespace }}
      sectionName: https
  hostnames:
    - {{ printf "%s.%s" .host $.Values.domain | quote }}
  rules:
    - backendRefs:
        - name: {{ .service }}
          port: {{ .port }}
{{- end }}
