# One ConfigMap per dashboards/*.json; Grafana's sidecar (kube-prometheus-stack) loads any ConfigMap labelled
# grafana_dashboard=1 from any namespace.
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-{{ base $path | trimSuffix ".json" }}
  labels:
    grafana_dashboard: "1"
data:
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
