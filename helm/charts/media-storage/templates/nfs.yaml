apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.volumeName }}
spec:
  capacity:
    storage: {{ .Values.size }}
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    {{- toYaml .Values.nfs.mountOptions | nindent 4 }}
  nfs:
    server: {{ .Values.nfs.server }}
    path: {{ .Values.nfs.path }}
  # Pre-bound so no other claim can grab it
  claimRef:
    namespace: {{ .Release.Namespace }}
    name: {{ .Values.claimName }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.claimName }}
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: {{ .Values.volumeName }}
  resources:
    requests:
      storage: {{ .Values.size }}
