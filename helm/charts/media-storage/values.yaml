# One shared NFS share for every media app, so downloads and the library sit on the same
# filesystem and imports can hardlink. Apps mount the `media-data` claim at /data.
#
# The PV's server/path are immutable: after changing them, delete the PVC + PV (data on the NAS
# is untouched, reclaim policy is Retain) and let Argo CD recreate them.
nfs:
  server: 192.168.3.21          # daga-nas port 2, reserved for Kubernetes NFS
  path: /volume2/video          # NFS rule: 192.168.3.11-13 only, RW, root squashed to guest; writable by DSM user media (1029:100)
  mountOptions:
    - nfsvers=4.1
    - hard
    - noatime

volumeName: media-data          # PV (cluster-scoped)
claimName: media-data           # PVC in the release namespace (media)
size: 1Ti                       # nominal; NFS doesn't enforce it

# Jellyfin's trickplay (scrub preview) tiles: a dedicated DSM share, mounted over /config/data/trickplay so the
# images live on the NAS while the media share stays read-only to Jellyfin. Plain JPEGs; Jellyfin can regenerate them.
trickplay:
  path: /volume2/trickplay      # NFS rule: 192.168.3.11-13 only, RW; writable by DSM user media (1029:100)
  volumeName: jellyfin-trickplay
  claimName: jellyfin-trickplay
  size: 200Gi                   # nominal

# Audio: two dedicated DSM shares, so the internet-facing Audiobookshelf never mounts the video share. (subPath on
# media-data can't work: root is squashed to guest and DSM denies guest, so kubelet can't prepare subdirectories,
# and the NAS refuses subdirectory mounts.)
# audiobooks: library/ = Bookshelf's root folder, audible/ = Libation's Audible backups. Audiobookshelf reads it.
# Bookshelf's downloads stay in media-data downloads/audiobooks, so its imports copy (no hardlinks across shares).
audiobooks:
  path: /volume2/audiobooks     # NFS rule: 192.168.3.11-13 only, RW, root squashed to guest; writable by DSM user media (1029:100)
  volumeName: audiobooks
  claimName: audiobooks
  size: 1Ti                     # nominal

# podcasts: episodes downloaded by Audiobookshelf (the only place it writes)
podcasts:
  path: /volume2/podcasts       # NFS rule: 192.168.3.11-13 only, RW, root squashed to guest; writable by DSM user media (1029:100)
  volumeName: podcasts
  claimName: podcasts
  size: 500Gi                   # nominal
