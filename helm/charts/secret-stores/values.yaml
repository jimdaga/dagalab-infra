vault:
  server: http://vault-active.vault.svc:8200
  kvPath: secret          # kv-v2 mount
  authMountPath: kubernetes
  role: external-secrets  # created by scripts/vault-bootstrap.sh

# ExternalSecrets: Vault kv key/property -> k8s Secret name/key in namespace.
# `enabled: false` skips an entry (and its namespace) until its Vault secret exists.
# Optional `template` renders the target Secret's keys from the fetched values
# (External Secrets template syntax; Helm leaves values-file strings untouched).
externalSecrets:
  - name: cloudflare-api-token
    namespace: cert-manager
    enabled: false   # TODO: enable after seeding Vault (scripts/vault-bootstrap.sh)
    data:
      - secretKey: api-token
        key: cloudflare
        property: api-token
  - name: cloudflare-api-token
    namespace: external-dns
    enabled: false   # TODO: enable after seeding Vault (scripts/vault-bootstrap.sh)
    data:
      - secretKey: api-token
        key: cloudflare
        property: api-token
  - name: grafana-admin
    namespace: monitoring
    data:
      - secretKey: admin-user
        key: grafana
        property: admin-user
      - secretKey: admin-password
        key: grafana
        property: admin-password
  - name: pia
    namespace: media
    data:
      - secretKey: OPENVPN_USER
        key: pia
        property: username
      - secretKey: OPENVPN_PASSWORD
        key: pia
        property: password
  - name: prowlarr
    namespace: media
    data:
      - secretKey: PROWLARR__AUTH__APIKEY   # Servarr env override for config.xml <ApiKey>
        key: prowlarr
        property: api-key
  - name: radarr
    namespace: media
    data:
      - secretKey: RADARR__AUTH__APIKEY   # Servarr env override for config.xml <ApiKey>
        key: radarr
        property: api-key
  - name: sonarr
    namespace: media
    data:
      - secretKey: SONARR__AUTH__APIKEY   # Servarr env override for config.xml <ApiKey>
        key: sonarr
        property: api-key
  - name: homepage
    namespace: homepage
    data:
      - secretKey: HOMEPAGE_VAR_SONARR_KEY   # read-only use by Homepage widgets
        key: sonarr
        property: api-key
      - secretKey: HOMEPAGE_VAR_RADARR_KEY   # read-only use by Homepage widgets
        key: radarr
        property: api-key
      - secretKey: HOMEPAGE_VAR_PROWLARR_KEY   # read-only use by Homepage widgets
        key: prowlarr
        property: api-key
      - secretKey: HOMEPAGE_VAR_JELLYFIN_KEY   # Jellyfin API key "homepage" (scripts/jellyfin-setup.sh)
        key: jellyfin
        property: homepage-key
      - secretKey: HOMEPAGE_VAR_BAZARR_KEY   # scripts/bazarr-setup.sh
        key: bazarr
        property: api-key
      - secretKey: HOMEPAGE_VAR_SEERR_KEY   # Seerr API key (scripts/seerr-setup.sh)
        key: seerr
        property: api-key
      - secretKey: HOMEPAGE_VAR_GLUETUN_KEY   # Gluetun control server (VPN status widget)
        key: gluetun
        property: api-key
      # password of the `homepage` UniFi account (local, Network View Only); the username is in the widget config.
      # The DSM one is in `homepage-synology` below.
      - secretKey: HOMEPAGE_VAR_UNIFI_PASSWORD
        key: homepage-devices
        property: unifi-password
  # Gluetun's HTTP control server: every route requires the API key (otherwise legacy routes are open)
  - name: bazarr
    namespace: media
    data:
      - secretKey: BAZARR_API_KEY   # set by scripts/bazarr-setup.sh; read by the Exportarr sidecar
        key: bazarr
        property: api-key
  - name: homarr
    namespace: homarr
    data:
      - secretKey: SECRET_ENCRYPTION_KEY   # 64 hex chars; encrypts integration secrets in Homarr's DB. Never rotate (DB unreadable)
        key: homarr
        property: encryption-key
  - name: jellyfin-arr
    namespace: media
    data:
      - secretKey: JELLYFIN_KEY   # Jellyfin API key "arr" (scripts/jellyfin-setup.sh); read by scripts/arr-run.sh
        key: jellyfin
        property: arr-key
  - name: gluetun-control
    namespace: media
    data:
      - secretKey: apikey
        key: gluetun
        property: api-key
    template:
      HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE: '{"auth":"apikey","apikey":"{{ .apikey }}"}'
  # Discord webhooks (one per channel; written by hand into Vault secret/discord). Alertmanager reads them as files.
  - name: discord
    namespace: monitoring
    extract: discord
  # same webhooks for the media apps' notifications (scripts/notify-setup.py, Unpackerr)
  - name: discord
    namespace: media
    extract: discord
  # DSM password of the `homepage` account (administrators: the stats API requires it). Homepage pastes it into the
  # login URL unencoded, so a '#' would cut it off: hand it over URL-encoded (DSM decodes it).
  - name: homepage-synology
    namespace: homepage
    data:
      - secretKey: password
        key: homepage-devices
        property: synology-password
    template:
      HOMEPAGE_VAR_SYNOLOGY_PASSWORD: '{{ .password | urlquery }}'
