vault:
  server: http://vault-active.vault.svc:8200
  kvPath: secret          # kv-v2 mount
  authMountPath: kubernetes
  role: external-secrets  # created by scripts/vault-bootstrap.sh

# ExternalSecrets: Vault kv key/property -> k8s Secret name/key in namespace.
# Optional `template` renders the target Secret's keys from the fetched values
# (External Secrets template syntax; Helm leaves values-file strings untouched).
externalSecrets:
  - name: cloudflare-api-token
    namespace: cert-manager
    data:
      - secretKey: api-token
        key: cloudflare
        property: api-token
  - name: cloudflare-api-token
    namespace: external-dns
    data:
      - secretKey: api-token
        key: cloudflare
        property: api-token
  - name: grafana-admin
    namespace: monitoring
    data:
      - secretKey: admin-user
        key: grafana
        property: admin-user
      - secretKey: admin-password
        key: grafana
        property: admin-password
  - name: synology-csi-client-info
    namespace: synology-csi
    data:
      - secretKey: host
        key: synology
        property: host
      - secretKey: username
        key: synology
        property: username
      - secretKey: password
        key: synology
        property: password
    # DSM's cert must validate for `host` (e.g. a Let's Encrypt cert issued by DSM for nas.jimdaga.dev)
    template:
      client-info.yaml: |
        clients:
          - host: "{{ .host }}"
            port: 5001
            https: true
            username: "{{ .username }}"
            password: "{{ .password }}"
